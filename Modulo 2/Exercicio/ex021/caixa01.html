<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixa</title>
    <style>
        h1 {
            height: 300px;
            width: 300px;
            background-color: #555555;
           border: 10px solid #000044;

           padding: 10px 10px 10px 10px;

           margin:10px auto 10px auto;

           outline: 3px dashed #440000;  
        }
        a {
           border:3px solid #000044;
           padding:3px;
           
        }

    </style>
</head>
<body>
    <h1>exelmplos de box-level</h1>
    <p>paragrefos são exemlos de box-level, mas os <a href="#">links são exemplos de inline-level</a>vamos ver como isso funciona.</p>
</body>
</html>
